plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

repositories {
    maven { url 'https://api.modrinth.com/maven' }  
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // Mixin declares ASM as 'provided', so it doesn't come along transitively. Needed for Opcodes constants in
    // @At(opcode = ...); both loaders have ASM at runtime, so this stays compile-only.
    compileOnly group: 'org.ow2.asm', name: 'asm', version: '9.7'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    compileOnly 'maven.modrinth:better-combat:2.3.2+1.21.1-neoforge'
    compileOnly 'maven.modrinth:simply-swords:1.63.0-1.21.1'
    compileOnly 'maven.modrinth:jade:15.10.0+neoforge'
    compileOnly 'maven.modrinth:simplymore:1.2.2'
    compileOnly 'maven.modrinth:curios:9.5.1+1.21.1'
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
}
