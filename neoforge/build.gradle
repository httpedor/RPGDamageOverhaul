plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

repositories {
    maven { url 'https://api.modrinth.com/maven' }
}
dependencies {
    implementation 'maven.modrinth:better-combat:2.3.2+1.21.1-neoforge'
    compileOnly 'maven.modrinth:simply-swords:1.63.0-1.21.1'
    implementation 'maven.modrinth:jade:15.10.0+neoforge'
    compileOnly 'maven.modrinth:simplymore:1.2.2'
    implementation 'maven.modrinth:curios:9.5.1+1.21.1'

    // Optional GearSockets compat. compileOnly: RPGDO compiles against its attachment API but does not
    // ship or require it at runtime -- the compat layer only activates when the mod is installed.
    implementation files('libs/gearsockets-1.0-SNAPSHOT.jar')


    runtimeOnly 'maven.modrinth:attributesetter:2.3-neoforge'
    runtimeOnly 'maven.modrinth:playeranimator:2.0.4+1.21.1-forge'
    runtimeOnly 'maven.modrinth:cloth-config:15.0.140+neoforge'
    runtimeOnly 'maven.modrinth:geckolib:gFmrC8Ru'
    runtimeOnly 'maven.modrinth:spark:1.10.124-neoforge-1.21.1'
    runtimeOnly 'maven.modrinth:caelus:KsfI4QsR'
    runtimeOnly 'maven.modrinth:architectury-api:13.0.8+neoforge'
    runtimeOnly 'maven.modrinth:foodattributes:2.0'
    runtimeOnly 'maven.modrinth:farmers-delight:1.21.1-1.3.4'
    runtimeOnly 'maven.modrinth:mmmmmmmmmmmm:1.21-2.1.0'
    runtimeOnly 'maven.modrinth:moonlight:1.21.1-3.6.1'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()

            // DataGen can be run by - "./gradlew :neoforge:runData" in Terminal.
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()

        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(Javadoc) {
    options.addStringOption('Xdoclint:none', '-quiet')
}
